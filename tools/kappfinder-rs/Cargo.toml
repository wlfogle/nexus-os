[package]
name = "kappfinder-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Finds installed applications with no menu entry and generates freedesktop .desktop files for them (a maintained KAppFinder equivalent)"
license = "GPL-3.0-or-later"
repository = "https://github.com/loufogle/nexus-os"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
walkdir = "2.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
