# kappfinder-rs built-in application catalog
#
# Each [[app]] is a recipe for one .desktop entry. The tool looks for `bin` on
# $PATH; if it is installed but has no menu entry anywhere in the XDG
# application directories, it offers to create one from this template.
#
# Fields:
#   bin            (required) executable name to look for on $PATH
#   name           (required) Name=
#   generic_name   GenericName=
#   comment        Comment=
#   icon           Icon= — an icon *theme name*, never a path
#   categories     Categories= — first element MUST be a freedesktop main category
#   terminal       Terminal= — true for console/TUI programs
#   keywords       Keywords=
#   exec_args      appended verbatim after the binary path in Exec= (e.g. "%F")
#   mime_types     MimeType=
#   startup_notify StartupNotify= — defaults to !terminal
#
# Extend or override this without rebuilding by creating
# $XDG_CONFIG_HOME/kappfinder-rs/catalog.toml using the same syntax. A user
# entry with the same `bin` replaces the built-in one outright.

# ---------------------------------------------------------------------------
# Legacy X11 applications — KAppFinder's original reason to exist
# ---------------------------------------------------------------------------

