# The controller's keyboard interface held XF86HomePage (keycode 180),
# repeatedly triggering Firefox. Leave gamepad and other input devices alone.
Section "InputClass"
    Identifier "Ignore Manba One keyboard interface"
    MatchProduct "Manba One BFM Keyboard"
    MatchUSBID "1949:0402"
    MatchIsKeyboard "on"
    Option "Ignore" "true"
EndSection
