[package]
name = "librarian"
version = "0.1.0"
description = "Repo-aware ecosystem librarian: reads, interprets and files everything you own"
authors = ["wlfogle"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "librarian_lib"
crate-type = ["lib", "cdylib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
tauri = { version = "2.8.5", features = [] }
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["full"] }

# No TLS backend: Ollama is reached over plain HTTP on loopback, so this avoids
# dragging in openssl/rustls entirely.
reqwest = { version = "0.12", default-features = false, features = ["json"] }

rusqlite = { version = "0.32", features = ["bundled"] }

anyhow = "1"
walkdir = "2"
sha2 = "0.10"
chrono = "0.4"
num_cpus = "1"
base64 = "0.22"

[features]
# Serves the frontend from the embedded bundle instead of the Vite dev server.
# Without it the binary tries to reach devUrl (localhost:5173) and fails with
# "connection refused" unless `npm run dev` happens to be running.
# `cargo tauri build` enables this automatically; a plain `cargo build` does not.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
