# NexusOS Limine Boot Configuration - Bahamut (AArch64 UEFI ISO)
# boot() refers to the EFI partition embedded in the ISO.
# Kernel must be in EFI/BOOT/ to be accessible from boot().

timeout: 5
default_entry: 1

/NexusOS Lite - Bahamut Network Edge
    protocol: limine
    path: boot():/EFI/BOOT/nexus-kernel
    cmdline: target=bahamut loglevel=info console=uart
